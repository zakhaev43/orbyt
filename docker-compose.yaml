name: orbyt

services:
  postgres:
    image: postgres:12-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=orbyt
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d orbyt" ]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgresql://root:secret@postgres:5432/orbyt?sslmode=disable
      - ALLOWED_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api